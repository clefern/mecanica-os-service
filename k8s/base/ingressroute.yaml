# Prioridade 200: mais específica que a rota catch-all /api (100) do
# monólito, que compartilha o mesmo namespace/gateway Traefik (D1).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: os-service-gateway
  labels:
    app: os-service
    tier: gateway
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/auth`)
      priority: 200
      services:
        - name: os-service
          port: 80
    - match: PathPrefix(`/api/ordens-servico`)
      priority: 200
      services:
        - name: os-service
          port: 80
